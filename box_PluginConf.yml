---
- name: Plugin Configurator Deploy
  hosts: windows
  gather_facts: false
  vars:
    # Application settings
    task_file: "{{ lookup('pipe','date +%Y-%m-%d') }} {{ semaphore_vars.task_details.id }}"
    app_name: "Brokeree.PluginConfigurator"
    services:
      - API
      - Connector.MT5
    app_files:
      - API
      - Connector.MT5

    ## Variables on Task Start
    # download_link

    ## Variables from Variable Groups:    
    # app_path
    # app_service
    # pg_db_name

    # pg_user
    # pg_password
    # pg_bin_path
    # pg_host
    # pg_port
    
  tasks:    
    - name: Create backup directories
      ansible.windows.win_file:
        path: "{{ app_path }}\\_backup\\{{ task_file }}\\{{ item.app_files }}"
        state: directory
      loop: "{{ app_files }}"
        
    - name: API Backup
      ansible.windows.win_copy:
        src: "{{ app_path }}\\API\\{{ item.source_file }}"
        dest: "{{ app_path }}\\_backup\\{{ task_file }}\\API"
        remote_src: true
      loop:
        - { source_file: 'ijwhost.dll', task_file: 'ijwhost.dll' }
        - { source_file: 'jobs.config', task_file: 'jobs.config' }
        - { source_file: 'MT5APIManager64.dll', task_file: 'MT5APIManager64.dll' }
        - { source_file: 'NLog.config', task_file: 'NLog.config' }
        - { source_file: 'PluginConfigurator.API.exe', task_file: 'PluginConfigurator.API.exe' }
        - { source_file: 'wwwadmin.zip', task_file: 'wwwadmin.zip' }
        
    - name: Connector.MT5 Backup
      ansible.windows.win_copy:
        src: "{{ app_path }}\\Connector.MT5\\{{ item.source_file }}"
        dest: "{{ app_path }}\\_backup\\{{ task_file }}\\Connector.MT5"
        remote_src: true
      loop:
        - { source_file: 'ijwhost.dll', task_file: 'ijwhost.dll' }
        - { source_file: 'MT5APIManager64.dll', task_file: 'MT5APIManager64.dll' }
        - { source_file: 'NLog.config', task_file: 'NLog.config' }
        - { source_file: 'PluginConfigurator.Connector.MT5.exe', task_file: 'PluginConfigurator.Connector.MT5.exe' }

    - name: Stop Services
      ansible.windows.win_service:
        name: "{{ app_service }}.{{ item }}"
        state: stopped
        start_mode: manual
      loop: "{{ services }}"

    - name: Set backup file path variable
      ansible.builtin.set_fact:
        backup_file: "{{ app_path }}\\_backup\\{{ task_file }}\\{{ pg_db_name }}.backup"
      
    - name: Run pg_dump to create database backup
      ansible.windows.win_powershell:
        script: |
          $env:PGPASSWORD = "{{ pg_password }}"
          & "{{ pg_bin_path }}\pg_dump.exe" --host="{{ pg_host }}" --port="{{ pg_port }}" --username="{{ pg_user }}" --format=custom --file="{{ backup_file }}" "{{ pg_db_name }}"
      no_log: true

    - name: Verify backup file creation
      ansible.windows.win_stat:
        path: "{{ backup_file }}"
      register: backup_stat

    - name: Create update directory
      ansible.windows.win_file:
        path: "{{ app_path }}\\_update"
        state: directory

    - name: Download archive from Box
      ansible.windows.win_get_url:
        url: "{{ download_link }}"
        dest: "{{ app_path }}\\_update\\app.zip"

    - name: Unarchiving
      community.windows.win_unzip:
        src: "{{ app_path }}\\_update\\app.zip"
        dest: "{{ app_path }}\\_update"
        rm: true 

    - name: Update Application files
      ansible.windows.win_copy:
        src: "{{ app_path }}\\_update\\{{ app_name }}\\{{ item.app_files }}\\"
        dest: "{{ app_path }}\\{{ item.app_files }}"
        remote_src: true
      loop: "{{ app_files }}"
        
    - name: Starting Services
      ansible.windows.win_service:
        name: "{{ app_service }}.{{ item }}"
        state: started
        start_mode: delayed
      ignore_errors: true
      loop: "{{ services }}"

    - name: Deleting update folder
      ansible.windows.win_file:
        path: "{{ app_path }}\\_update"
        state: absent
